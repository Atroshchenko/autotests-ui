# python_classes = Test* Устанавливает правила для имен классов
# python_functions = test_* Устанавливает правила для имен функций

[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    ui: запускает все UI автотесты
    smoke: запускает все smoke автотесты
    regression: запускает все regression автотесты
    registration: запускает все registration автотесты
    slow: запускает все slow автотесты
    critical: запускает все critical автотесты
    authorization: запускает все authorization автотесты