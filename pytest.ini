# python_classes = Test* Устанавливает правила для имен классов
# python_functions = test_* Устанавливает правила для имен функций

[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    ui: Маркировка для UI автотестов
    smoke: Маркировка для smoke автотестов
    regression: Маркировка для regression автотестов
    registration: Маркировка для registration автотестов
    slow: Маркировка для slow автотестов
    critical: Маркировка для critical автотестов
    authorization: Маркировка для authorization автотестов
    dashboard: Маркировка для тестов, связанных с рабочей панелью
    courses: